*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{display:flex;flex-direction:column;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding-block:8px;background:var(--bg)}
.logo{flex:0 0 auto;width:104px;height:12px;display:block}
.pname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 9px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--btn-fg)}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:12px}
.ibtn:disabled{opacity:.4;cursor:default}
.cota{height:9px;position:relative;margin-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--accent);opacity:.8}
.cota:before,.cota:after{content:"";position:absolute;bottom:-5px;width:1px;height:9px;background:var(--accent)}
.cota:before{left:0}.cota:after{right:0}
.rooms,.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.rooms::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.chip.add{border-style:dashed;color:var(--muted)}
.tabs{padding-top:2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);gap:0;flex:0 0 auto;background:var(--bg,inherit)}
#left{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.tab{flex:1 0 auto;border:0;background:none;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:160px;background:var(--p-paper);border-bottom:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage svg{display:block;touch-action:none}
#hud{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
#hud button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1;padding:0}
#hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);background:color-mix(in srgb,var(--p-paper) 85%,transparent);padding:2px 6px;border-radius:5px;pointer-events:none;max-width:70%}
#panel{flex:1;min-height:0;overflow-y:auto;padding-block:12px 20px;background:var(--bg)}
h2{font-family:var(--f-serif);font-weight:500;font-size:22px;margin:0 0 6px;letter-spacing:.01em}
h3{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.fld{display:flex;flex-direction:column;gap:3px;flex:1 1 120px;min-width:110px}
.fld>span{font-size:11px;color:var(--muted)}
.fld .in{display:flex;gap:4px}
.fld textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:13px;resize:vertical;font-family:var(--f-sans)}
.fld input,.fld select{width:100%;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-family:var(--f-mono);font-size:13px}
.fld input[type=text].txt,.fld input.txt{font-family:var(--f-sans)}
.fld input:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.meas{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:0 8px;font-size:11px;font-family:var(--f-mono);color:var(--accent)}
.meas.laser{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-fg);border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px}
.btn.sec{background:none;color:var(--fg);border-color:var(--line)}
.btn.dng{background:none;color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:6px 10px;font-size:12px}
.wchips{display:flex;gap:6px;flex-wrap:wrap}
.wchip{min-width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:600}
.wchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv b{font-family:var(--f-mono);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:12px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.lib button{display:flex;align-items:center;gap:7px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;font-size:12px;line-height:1.2}
.lib .gl{flex:0 0 26px;height:26px;display:grid;place-items:center;border:1.5px solid currentColor;font-family:var(--f-mono);font-weight:600;font-size:9px}
.lib .gl.ele{border-radius:50%;color:var(--p-ele)}.lib .gl.hid{color:var(--p-hid)}.lib .gl.ar{color:var(--p-ar);border-radius:3px}.lib .gl.cor{color:var(--p-cor);border-style:dashed}.lib .gl.esq{color:var(--fg);border-width:1px}
.list{display:flex;flex-direction:column;gap:4px}
.list button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13px}
.list button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.list .m{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--fg)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.thumbs button{flex:0 0 auto;width:84px;height:64px;border:2px solid var(--line);border-radius:8px;background:var(--surface) center/cover no-repeat;padding:0}
.thumbs button[aria-pressed=true]{border-color:var(--accent)}
.badge{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.laser{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
footer{border-top:1px solid var(--line);background:var(--surface);padding-block:7px;display:flex;align-items:center;gap:10px;font-size:12px}
footer .st{flex:1;min-width:0;color:var(--muted);line-height:1.25}
footer .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-fg);padding:9px 14px;border-radius:9px;font-size:13px;max-width:min(92vw,460px);z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.25)}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0}
#sheet{position:absolute;left:0;right:0;bottom:44px;height:46px;z-index:5;display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 22px rgba(0,0,0,.2);transition:height .18s ease;overflow:hidden}
#sheet.drag{transition:none}
#grip{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#grip i{width:40px;height:4px;border-radius:2px;background:var(--line)}
#gtitle{font-size:12px;font-weight:600;color:var(--muted);white-space:pre}
@media (max-width:899px){body.work .rooms,body.work footer{display:none}}
@media (min-width:900px){
  main{flex-direction:row}
  #left{display:grid;grid-template-columns:1fr 400px;grid-template-rows:1fr auto}
  #stage{grid-column:1;grid-row:1;border-bottom:0;border-right:1px solid var(--line)}
  .tabs{grid-column:1;grid-row:2}
  #sheet{position:static;grid-column:2;grid-row:1 / span 2;height:auto;border-radius:0;box-shadow:none;border-top:0;transition:none}
  #grip{display:none}
  .logo{width:132px;height:15px}
}

#bt{padding:4px 9px;font-size:12px;font-weight:600}
#bt[data-state=on]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.meas.armed{background:var(--accent);color:var(--accent-fg);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.btlog{margin:0;padding:8px;background:var(--surface2);border-radius:8px;font:11px/1.5 'IBM Plex Mono',monospace;overflow-x:auto;white-space:pre}

<script>/* ===== Tégora · núcleo: unidades, geometria, modelo de dados ===== */
'use strict';

/* ---------- Unidades ---------- */
const UNITS = { mm: { f: 1, dec: 0 }, cm: { f: 10, dec: 1 }, m: { f: 1000, dec: 3 } };
let UNIT = 'mm';
function setUnit(u) { if (UNITS[u]) UNIT = u; }

function fmt(mm, unit, withUnit) {
  unit = unit || UNIT;
  const u = UNITS[unit];
  let s = (mm / u.f).toFixed(u.dec);
  let neg = s[0] === '-';
  if (neg) s = s.slice(1);
  let [i, d] = s.split('.');
  if (unit === 'mm') i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  s = (neg ? '-' : '') + (d !== undefined ? i + ',' + d : i);
  return withUnit ? s + ' ' + unit : s;
}

function parseIn(str, unit) {
  unit = unit || UNIT;
  if (str == null) return NaN;
  let s = String(str).trim().replace(/\s/g, '').replace(/[a-zA-Zµ²³]/g, '');
  if (!s) return NaN;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) {
    if (unit === 'mm' || /,/.test(s)) s = s.replace(/\./g, '');
  }
  s = s.replace(',', '.');
  const v = parseFloat(s);
  if (!isFinite(v)) return NaN;
  return Math.round(v * UNITS[unit].f * 10) / 10;
}

/* ---------- Vetores ---------- */
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
const vmul = (a, k) => [a[0] * k, a[1] * k];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1];
const vlen = a => Math.hypot(a[0], a[1]);
const vnorm = a => { const l = vlen(a) || 1e-9; return [a[0] / l, a[1] / l]; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rnd = (x, p) => { p = p || 1; return Math.round(x / p) * p; };
function uid(p) { return (p || 'i') + Math.random().toString(36).slice(2, 8); }

function area2(pts) {
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    s += a[0] * b[1] - b[0] * a[1];
  }
  return s / 2;
}
/* Polígono sempre horário (y para cima): o interior fica à direita de cada parede */
function orientCW(pts) { return area2(pts) > 0 ? pts.slice().reverse() : pts; }

function wallGeom(room, i) {
  const n = room.pts.length;
  const A = room.pts[i], B = room.pts[(i + 1) % n];
  const dx = B[0] - A[0], dy = B[1] - A[1];
  const L = Math.hypot(dx, dy) || 1e-9;
  const d = [dx / L, dy / L];
  return { A, B, L, d, nin: [d[1], -d[0]] };
}
function wallLen(room, i) { return wallGeom(room, i).L; }

function lineInter(p, d, q, e) {
  const den = d[0] * e[1] - d[1] * e[0];
  if (Math.abs(den) < 1e-9) return null;
  const t = ((q[0] - p[0]) * e[1] - (q[1] - p[1]) * e[0]) / den;
  return [p[0] + d[0] * t, p[1] + d[1] * t];
}
/* t > 0 desloca para dentro, t < 0 para fora (polígono horário) */
function offsetPoly(pts, t) {
  const n = pts.length, out = [];
  for (let j = 0; j < n; j++) {
    const p0 = pts[(j - 1 + n) % n], p1 = pts[j], p2 = pts[(j + 1) % n];
    const d1 = vnorm(vsub(p1, p0)), d2 = vnorm(vsub(p2, p1));
    const n1 = [d1[1], -d1[0]], n2 = [d2[1], -d2[0]];
    const a = vadd(p1, vmul(n1, t)), c = vadd(p1, vmul(n2, t));
    out.push(lineInter(a, d1, c, d2) || a);
  }
  return out;
}

function pointInPoly(p, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[i], b = pts[j];
    if (((a[1] > p[1]) !== (b[1] > p[1])) && (p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0])) inside = !inside;
  }
  return inside;
}
function onPolyEdge(p, pts, tol) {
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const ab = vsub(b, a), ap = vsub(p, a);
    const t = clamp(vdot(ap, ab) / (vdot(ab, ab) || 1), 0, 1);
    if (vlen(vsub(p, vadd(a, vmul(ab, t)))) <= tol) return true;
  }
  return false;
}
function insideRoom(p, pts, tol) { return onPolyEdge(p, pts, tol || 2) || pointInPoly(p, pts); }
function rectInsideRoom(x, y, w, h, pts) {
  if (w < 50 || h < 50) return false;
  const c = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  if (!c.every(p => insideRoom(p, pts))) return false;
  const e = [[x + w / 2, y], [x + w, y + h / 2], [x + w / 2, y + h], [x, y + h / 2], [x + w / 2, y + h / 2]];
  if (!e.every(p => insideRoom(p, pts))) return false;
  for (const p of pts) if (p[0] > x + 1 && p[0] < x + w - 1 && p[1] > y + 1 && p[1] < y + h - 1) return false;
  return true;
}
function bbox(pts) {
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  for (const p of pts) { a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); }
  return { x0: a, y0: b, x1: c, y1: d, w: c - a, h: d - b };
}
function centroid(pts) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    const f = p[0] * q[1] - q[0] * p[1];

/* Alterar o comprimento da parede i: a parede seguinte desliza, o ambiente continua fechado e ortogonal.
   Esquadrias e pontos das paredes afetadas acompanham de forma proporcional. */
function setWallLen(room, i, newLen, src) {
  const n = room.pts.length;
  newLen = Math.round(newLen * 10) / 10;
  if (!(newLen >= 50)) return { ok: false, msg: 'A parede precisa ter pelo menos 50 mm.' };
  const before = room.pts.map((_, k) => wallLen(room, k));
  const g = wallGeom(room, i);
  const delta = newLen - g.L;
  if (Math.abs(delta) < 0.05) return { ok: true };
  const j = (i + 1) % n, k = (i + 2) % n;
  const old = room.pts.map(p => p.slice());
  room.pts[j] = vadd(room.pts[j], vmul(g.d, delta));
  room.pts[k] = vadd(room.pts[k], vmul(g.d, delta));
  const after = room.pts.map((_, w) => wallLen(room, w));
  if (after.some(l => l < 50)) { room.pts = old; return { ok: false, msg: 'Essa medida faria outra parede ficar menor que 50 mm.' }; }
  room.wsrc[i] = src || 'manual';
  for (let w = 0; w < n; w++) {
    if (Math.abs(after[w] - before[w]) > 0.05) {
      const f = after[w] / before[w];
      for (const it of room.items) if (it.wall === w) {
        it.u = Math.round(it.u * f * 10) / 10;
        if (it.kind === 'op') it.u = clamp(it.u, 0, Math.max(0, after[w] - it.w));
        else it.u = clamp(it.u, 0, after[w]);
      }
    }
  }
  return { ok: true };
}

/* Recuo (depth < 0) ou pilar (depth > 0) na parede i, entre u0 e u0 + width */
function addNotch(room, i, u0, width, depth) {
  const g = wallGeom(room, i);
  if (!(u0 >= 50 && width >= 50 && g.L - (u0 + width) >= 50 && Math.abs(depth) >= 20)) {
    return { ok: false, msg: 'Posição e largura precisam caber na parede, deixando 50 mm de cada lado.' };
  }
  const wn0 = room.wn ? room.wn.slice() : room.pts.map((_, k) => k + 1), mx0 = Math.max(...wn0);
  const P = (a, b) => vadd(vadd(g.A, vmul(g.d, a)), vmul(g.nin, b));
  const np = [P(u0, 0), P(u0, depth), P(u0 + width, depth), P(u0 + width, 0)];
  room.pts.splice(i + 1, 0, ...np);
  wn0.splice(i + 1, 0, mx0 + 1, mx0 + 2, mx0 + 3, mx0 + 4); room.wn = wn0;
  room.wsrc.splice(i + 1, 0, null, null, null, null);
  if (room.wt) room.wt.splice(i + 1, 0, 0, 0, 0, 0);
  for (const it of room.items) {
    if (it.wall > i) it.wall += 4;
    else if (it.wall === i) {
      const c = it.kind === 'op' ? it.u + it.w / 2 : it.u;
      if (c > u0 + width) { it.wall = i + 4; it.u = Math.max(0, it.u - (u0 + width)); }

  }

}

      if (p[1] >= lo - 0.01 && p[1] <= hi + 0.01) { if (a[0] <= p[0] + 0.01) xl = Math.max(xl, a[0]); if (a[0] >= p[0] - 0.01) xr = Math.min(xr, a[0]); }

      if (p[0] >= lo - 0.01 && p[0] <= hi + 0.01) { if (a[1] <= p[1] + 0.01) yb = Math.max(yb, a[1]); if (a[1] >= p[1] - 0.01) yt = Math.min(yt, a[1]); }

/* ---------- Forro (gesso) ---------- */
/* afastamento por aresta (d[i] > 0 recua a aresta i → i+1 para dentro); serve a qualquer orientação */

/* O que o forro faz na parede i, para a vista frontal */
function ceilOnWall(room, wall) {
  const g = wallGeom(room, wall);
  const out = [];
  const TOL = 5;
  for (const el of room.ceil) {
    const poly = ceilPoly(room, el);
    if (el.kind === 'room' && !(el.eo && el.eo.some(v => v))) { out.push({ el, u0: 0, u1: g.L, touching: true, dist: 0 }); continue; }

    const us = poly.map(p => vdot(vsub(p, g.A), g.d));

/* ---------- Contorno à mão livre → paredes ortogonais ---------- */
function rdp(pts, eps) {
  if (pts.length < 3) return pts.slice();

    const p = pts[i];
    const d = L < 1e-6 ? Math.hypot(p[0] - a[0], p[1] - a[1]) : Math.abs(dy * p[0] - dx * p[1] + b[0] * a[1] - b[1] * a[0]) / L;

function traceToPoly(tr) {

  if (tr.length < 6) return fail('Traço curto demais. Contorne o ambiente de canto em canto.');
  const b = bbox(tr), D = Math.max(b.w, b.h);

  for (const g of segs) {
    const l = m[m.length - 1];
    if (l && l.h === g.h) { l.c = (l.c * l.w + g.c * g.w) / (l.w + g.w); l.w += g.w; } else m.push(Object.assign({}, g));

/* ===== Tégora · desenhos técnicos (planta, parede, forro, fotos) ===== */
'use strict';

const PAL_PRINT = {
  paper: '#FFFFFF', floor: '#FFFFFF', wall: '#2A2826', ink: '#2A2826', dim: '#7A5E36', mut: '#6A645B', faint: '#CBC4B8',
  accent: '#9C7A48', sel: '#9C7A48', ele: '#A3631A', hid: '#2B6A8C', ar: '#3F7A55', cor: '#7A5E36',
  gesso: '#EFEBE4', gessoLn: '#9C8F7C', neg: '#2A2826', roda: '#CBC4B8', door: '#F6F3EE', glass: '#DCE6EA', ok: '#2A2826', surf: '#F4F1EC',
};
const PAL_SCREEN = {};
Object.keys(PAL_PRINT).forEach(k => { PAL_SCREEN[k] = 'var(--p-' + k + ')'; });

class View {
  constructor(s, ox, oy) { this.s = s; this.ox = ox; this.oy = oy; }
  X(x) { return this.ox + this.s * x; }
  Y(y) { return this.oy - this.s * y; }
  inv(px, py) { return [(px - this.ox) / this.s, (this.oy - py) / this.s]; }
  static fit(b, r, pad) {
    const bw = Math.max(b.x1 - b.x0, 1), bh = Math.max(b.y1 - b.y0, 1);
    const s = Math.min((r.w - 2 * pad) / bw, (r.h - 2 * pad) / bh);
    return new View(s, r.x + r.w / 2 - s * (b.x0 + b.x1) / 2, r.y + r.h / 2 + s * (b.y0 + b.y1) / 2);
  }
}
const mkCtx = (G, v, o) => Object.assign({ G, v, K: 1, P: PAL_SCREEN, hit: true }, o || {});
const dev = (c, p) => [c.v.X(p[0]), c.v.Y(p[1])];
const polyDev = (c, pts) => pts.map(p => dev(c, p));
const LY = (c, n) => { if (c.G.layer) c.G.layer(n); };
const CATLAYER = { ele: 'TG_ELETRICA', hid: 'TG_HIDRAULICA', ar: 'TG_AR', cor: 'TG_CORINGA' };
const lum = h => { const [r, g, b] = hexRGB(h); return 0.299 * r + 0.587 * g + 0.114 * b; };

/* ---------- marcas e cotas ---------- */
function checkMark(c, x, y, s, col, ang) {
  const th = (ang || 0) * Math.PI / 180, ct = Math.cos(th), st = Math.sin(th);
  const pts = [[-0.45, 0.05], [-0.1, 0.42], [0.5, -0.45]].map(p => {
    const px = p[0] * s, py = p[1] * s;
    return [x + px * ct - py * st, y + px * st + py * ct];
  });
  c.G.poly(pts, { close: false, stroke: col, w: 1.3 * c.K });
}
/* p1, p2 em coordenadas do mundo; nw = direção (mundo) para onde a linha de cota é deslocada; off em px */
function dimLine(c, p1, p2, nw, off, text, o) {
  o = o || {};

  const prevL = G.cur; LY(c, 'TG_COTAS');
  const x1 = v.X(p1[0]), y1 = v.Y(p1[1]), x2 = v.X(p2[0]), y2 = v.Y(p2[1]);
  let nx = nw[0], ny = -nw[1]; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
  const ox = nx * off * K, oy = ny * off * K;

  const col = o.color || P.dim;
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const ex = 3.5 * K;
  G.line(x1 + nx * 2 * K, y1 + ny * 2 * K, a[0] + nx * ex, a[1] + ny * ex, { stroke: col, w: 0.6 * K });
  G.line(x2 + nx * 2 * K, y2 + ny * 2 * K, b[0] + nx * ex, b[1] + ny * ex, { stroke: col, w: 0.6 * K });
  G.line(a[0], a[1], b[0], b[1], { stroke: col, w: 0.9 * K });
  const tx = len > 0.01 ? (b[0] - a[0]) / len : 1, ty = len > 0.01 ? (b[1] - a[1]) / len : 0;
  const tk = 3.2 * K, kx = tx - nx, ky = ty - ny, kl = Math.hypot(kx, ky) || 1;
  for (const q of [a, b]) G.line(q[0] - kx / kl * tk, q[1] - ky / kl * tk, q[0] + kx / kl * tk, q[1] + ky / kl * tk, { stroke: col, w: 1.1 * K });

  let ang = Math.atan2(ty, tx) * 180 / Math.PI;
  if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
  const fs = (o.size || 8.5) * K;
  const tp = o.tpos == null ? 0.5 : o.tpos;
  const mx = a[0] + (b[0] - a[0]) * tp + nx * (fs * 0.72 + 1.5 * K), my = a[1] + (b[1] - a[1]) * tp + ny * (fs * 0.72 + 1.5 * K);
  G.text(mx, my, text, { size: fs, rot: ang, fill: o.tcolor || P.ink, font: 'mono', bold: o.bold });
  if (o.src === 'laser') {
    const w = textW(text, fs, { font: 'mono' });
    const dx = Math.cos(ang * Math.PI / 180), dy = Math.sin(ang * Math.PI / 180);
    checkMark(c, mx - dx * (w / 2 + 4.5 * K), my - dy * (w / 2 + 4.5 * K), 6 * K, col, ang);
  }

}
function badge(c, x, y, s, o) {
  o = o || {};
  const { G, K, P } = c, r = (o.r || 6.2) * K;
  LY(c, 'TG_ROTULOS');
  G.circle(x, y, r, { fill: o.fill || P.paper, stroke: o.stroke || P.ink, w: 0.9 * K });
  G.text(x, y, s, { size: (o.size || 7.6) * K, bold: true, fill: o.tcolor || P.ink, font: 'sans' });
}

/* ---------- planta ---------- */
function chainSegs(room, wi) {
  const g = wallGeom(room, wi);
  const ops = itemsOn(room, wi).filter(i => i.kind === 'op');
  const segs = []; let cur = 0;
  for (const it of ops) {
    const a = clamp(it.u, 0, g.L), b = clamp(it.u + it.w, 0, g.L);
    if (a - cur >= 1) segs.push({ a: cur, b: a, src: null });
    if (b - a >= 1) segs.push({ a, b, src: it.src, op: true });
    cur = Math.max(cur, b);
  }
  if (g.L - cur >= 1) segs.push({ a: cur, b: g.L, src: null });
  return { segs, ops };
}

function drawWallsBase(c, room, o) {
  const { G, v, K, P } = c;
  const twArr = room.pts.map((_, i) => Math.max(5 * K / v.s, wallT(room, i)));
  const tw = Math.max(...twArr), twPx = tw * v.s;
  LY(c, 'TG_PAREDES');
  G.poly(polyDev(c, offsetPolyVar(room.pts, twArr.map(x => -x))), { fill: P.wall });
  G.poly(polyDev(c, room.pts), { fill: P.floor });
  return { tw, twPx, twArr };
}

function planOpening(c, it, g, tw, tag) {
  const { G, v, K, P } = c;
  LY(c, 'TG_ESQUADRIAS');
  const Wp = (u, b) => dev(c, [g.A[0] + g.d[0] * u + g.nin[0] * b, g.A[1] + g.d[1] * u + g.nin[1] * b]);
  const u0 = it.u, u1 = it.u + it.w, eps = 0.8 * K / v.s;
  G.poly([Wp(u0, eps), Wp(u1, eps), Wp(u1, -tw - eps), Wp(u0, -tw - eps)], { fill: P.floor });
  const ink = { stroke: P.ink, w: 1.1 * K }, thin = { stroke: P.ink, w: 0.7 * K };

  const t = it.type;
  const leaf = (hu, dirSign, wd, swIn) => {
    const hb = swIn ? 0 : -tw;
    const H = [g.A[0] + g.d[0] * hu + g.nin[0] * hb, g.A[1] + g.d[1] * hu + g.nin[1] * hb];
    const nd = swIn ? g.nin : [-g.nin[0], -g.nin[1]];
    const dd = [g.d[0] * dirSign, g.d[1] * dirSign];
    const E = [H[0] + nd[0] * wd, H[1] + nd[1] * wd];
    G.line(...dev(c, H), ...dev(c, E), { stroke: P.ink, w: 1.4 * K });
    const a0 = Math.atan2(nd[1], nd[0]); let a1 = Math.atan2(dd[1], dd[0]);
    let da = a1 - a0; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    if (G.arc) { const cd = dev(c, H); G.arc(cd[0], cd[1], wd * v.s, Math.min(a0, a0 + da) * 180 / Math.PI, Math.max(a0, a0 + da) * 180 / Math.PI); }
    else {
      const pts = [];
      for (let k = 0; k <= 14; k++) { const a = a0 + da * k / 14; pts.push(dev(c, [H[0] + Math.cos(a) * wd, H[1] + Math.sin(a) * wd])); }
      G.poly(pts, { close: false, stroke: P.mut, w: 0.7 * K });

    G.line(...Wp(u0 + m * 0.44, -tw * 0.7), ...Wp(u1, -tw * 0.7), ink);
    if (t !== 'porta-correr') { G.line(...Wp(u0, 0), ...Wp(u1, 0), thin); G.line(...Wp(u0, -tw), ...Wp(u1, -tw), thin); }

function drawDrains(c, room, o) {
  const { G, v, K, P } = c;
  LY(c, 'TG_HIDRAULICA');
  (room.drains || []).forEach((d, k) => {
    const [x, y] = dev(c, [d.x, d.y]);
    const r = Math.max(d.d / 2 * v.s, 6.5 * K), sel = o.selDrain === d.id;
    G.circle(x, y, r, { fill: P.paper, stroke: sel ? P.sel : P.hid, w: (sel ? 2.4 : 1.5) * K });
    const q = r * 0.7;
    G.line(x - q, y - q, x + q, y + q, { stroke: P.hid, w: 1 * K });
    G.line(x - q, y + q, x + q, y - q, { stroke: P.hid, w: 1 * K });
    G.text(x + r + 3 * K, y - r - 2 * K, 'RL' + (k + 1), { size: 7.6 * K, bold: true, anchor: 'start', fill: P.hid });

function drawPlan(c, room, o) {
  o = o || {};
  const { G, v, K, P } = c;
  const { tw, twPx, twArr } = drawWallsBase(c, room);
  const n = room.pts.length;
  const lab = labelsFor(room);
  for (const it of room.items) if (it.kind === 'op') planOpening(c, it, wallGeom(room, it.wall), twArr[it.wall], o.mini ? null : lab.tags[it.id]);
  drawDrains(c, room, o);
  if (o.corners && c.hit && !o.mini) {
    LY(c, 'TG_ROTULOS');
    room.pts.forEach((p, k) => {
      const [x, y] = dev(c, p), sel = o.selCorner === k;
      G.circle(x, y, (sel ? 8 : 6) * K, { fill: sel ? P.sel : P.paper, stroke: sel ? P.sel : P.accent, w: 1.6 * K });
      G.circle(x, y, 17, { fill: 'rgba(0,0,0,0.001)', stroke: 'none', pe: 'all', id: 'c:' + k });

  }
  if (o.selWall != null && o.selWall < n) {

    G.line(...dev(c, g.A), ...dev(c, g.B), { stroke: P.sel, w: 3 * K });
  }
  for (let i = 0; i < n; i++) {
    const g = wallGeom(room, i);

    if (o.mini) continue;

    const ct = centroid(room.pts), q = dev(c, ct);
    const s = roomSummary(room);

    G.text(q[0], q[1] - 8 * K, room.name, { size: 15 * K, font: 'serif', bold: true, fill: P.ink });
    G.text(q[0], q[1] + 7 * K, (s.area / 1e6).toFixed(2).replace('.', ',') + ' m²', { size: 9 * K, font: 'mono', fill: P.mut });

/* ---------- forro em planta ---------- */
function hatchPoly(c, pts, step, col, ang) {
  const { G } = c;

    if (sel) G.rect(cx - gl.wpx / 2 - 3 * K, cy - gl.hpx / 2 - 3 * K, gl.wpx + 6 * K, gl.hpx + 6 * K, { stroke: P.sel, w: 1.6 * K, dash: [3 * K, 2 * K] });
    G.text(cx, cy - gl.hpx / 2 - 6.5 * K, String(lab.nums[it.id]), { size: 7.6 * K, bold: true, fill: P.ink });
    if (!o.ptDims) G.text(cx, cy + gl.hpx / 2 + 6.5 * K, fmt(it.z), { size: 6.6 * K, font: 'mono', fill: P.mut });
    if (c.hit) G.hitRect(cx - Math.max(gl.wpx / 2, 11), cy - Math.max(gl.hpx / 2, 11), Math.max(gl.wpx, 22), Math.max(gl.hpx, 22), 'i:' + it.id);
  }
  /* cotas horizontais acima da parede */
  const up = [0, 1], ops = items.filter(i => i.kind === 'op'), pts = items.filter(i => i.kind === 'pt');
  let off = 12 + wallTopExtra(room) * v.s / K;
  if (ops.length) {
    const ch = chainSegs(room, wi);
    for (const s of ch.segs) dimLine(c, [s.a, H], [s.b, H], up, off, fmt(s.b - s.a), { src: s.src });
    off += 15;
  }
  if (pts.length && pts.length <= 10) {
    const xs = [0, ...pts.map(p => p.u), L].sort((a, b) => a - b);
    const lv = hChain(c, xs, H, 1, off, [P.mut], { size: 7.6 });
    off += 15 + lv * 8.5;
  }
  dimLine(c, [0, H], [L, H], up, off, fmt(L), { src: room.wsrc[wi], bold: true });
  dimLine(c, [0, 0], [0, H], [-1, 0], 14, fmt(H), { src: room.Hsrc, bold: true });
  /* cotas de cada ponto, na cor da sua categoria (PDF) */
  if (o.ptDims && pts.length) ptDimsAll(c, pts, L);
  /* cotas verticais das esquadrias */
  for (const it of ops) {
    if (!(o.allDims || o.sel === it.id)) continue;
    const xr = it.u + it.w, tx = [1, 0];
    if (it.z > 1) dimLine(c, [xr, 0], [xr, it.z], tx, 7, fmt(it.z), { src: it.src, size: 7.6 });
    dimLine(c, [xr, it.z], [xr, it.z + it.h], tx, 7, fmt(it.h), { src: it.src, size: 7.6 });
    if (H - (it.z + it.h) > 1) dimLine(c, [xr, it.z + it.h], [xr, H], tx, 7, fmt(H - it.z - it.h), { color: P.mut, tcolor: P.mut, size: 7.6 });
  }
  /* guias do item selecionado */
  if (o.sel) {
    const it = room.items.find(i => i.id === o.sel && i.wall === wi);
    if (it) {
      const b = itemBox(it), cz = it.kind === 'op' ? (b.z0 + b.z1) / 2 : zc(it), cu = it.kind === 'op' ? it.u : it.u;
      const ac = { color: P.sel, tcolor: P.sel, size: 8 };
      if (it.kind === 'pt') {
        dimLine(c, [0, cz], [it.u, cz], [0, -1], 0, fmt(it.u), Object.assign({ src: it.src }, ac));
        dimLine(c, [it.u, cz], [L, cz], [0, -1], 0, fmt(L - it.u), ac);
        dimLine(c, [it.u, 0], [it.u, it.zb ? it.z : cz], [1, 0], 0, fmt(it.z), ac);
        dimLine(c, [it.u, it.zb ? it.z + it.h : cz], [it.u, H], [1, 0], 0, fmt(H - (it.zb ? it.z + it.h : it.z)), ac);
      } else {
        dimLine(c, [0, cz], [it.u, cz], [0, -1], 0, fmt(it.u), Object.assign({ src: it.src }, ac));
        dimLine(c, [it.u + it.w, cz], [L, cz], [0, -1], 0, fmt(L - it.u - it.w), ac);
      }
    }
  }
}

/* miniatura da planta com a parede em destaque e o sentido da vista */
function drawMini(c, room, wi) {
  const { G, K, P } = c;
  G.poly(polyDev(c, room.pts), { fill: P.floor, stroke: P.ink, w: 1.1 * K });
  const g = wallGeom(room, wi);
  G.line(...dev(c, g.A), ...dev(c, g.B), { stroke: P.sel, w: 3.2 * K });
  const m = vadd(g.A, vmul(g.d, g.L / 2));
  const from = vadd(m, vmul(g.nin, 16 * K / c.v.s)), to = vadd(m, vmul(g.nin, 3 * K / c.v.s));
  const a = dev(c, from), b = dev(c, to);
  G.line(a[0], a[1], b[0], b[1], { stroke: P.sel, w: 1.1 * K });
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  G.poly([[b[0], b[1]], [b[0] - ux * 5 * K - uy * 2.8 * K, b[1] - uy * 5 * K + ux * 2.8 * K], [b[0] - ux * 5 * K + uy * 2.8 * K, b[1] - uy * 5 * K - ux * 2.8 * K]], { fill: P.sel });
}

/* ---------- fotos com cotas ---------- */
function drawAnn(c, an, x0, y0, W, sel) {
  const { G, K, P } = c;
  const a = [x0 + an.x1 * W, y0 + an.y1 * W], b = [x0 + an.x2 * W, y0 + an.y2 * W];
  const col = an.color || '#F2C200';
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const wl = (sel ? 3.2 : 2.4) * K;
  const halo = { stroke: '#000000', w: wl + 1.4 * K };
  const main = { stroke: col, w: wl };
  G.line(a[0], a[1], b[0], b[1], halo);
  if (an.kind === 'arrow') {
    for (const [p, s] of [[a, 1], [b, -1]]) {
      const tip = p, bx = p[0] + s * ux * 11 * K, by = p[1] + s * uy * 11 * K;
      G.poly([tip, [bx - uy * 4.6 * K, by + ux * 4.6 * K], [bx + uy * 4.6 * K, by - ux * 4.6 * K]], { fill: col, stroke: '#000000', w: 0.8 * K });
    }
  } else {
    for (const p of [a, b]) G.line(p[0] - uy * 8 * K, p[1] + ux * 8 * K, p[0] + uy * 8 * K, p[1] - ux * 8 * K, { stroke: '#000000', w: wl + 1.4 * K });
  }
  G.line(a[0], a[1], b[0], b[1], main);
  if (an.kind !== 'arrow') for (const p of [a, b]) G.line(p[0] - uy * 8 * K, p[1] + ux * 8 * K, p[0] + uy * 8 * K, p[1] - ux * 8 * K, main);
  const text = an.lbl || (an.mm > 0 ? fmt(an.mm) : (an.kind === 'arrow' ? '' : '?'));
  if (!text) { if (c.hit) G.hitLine(a[0], a[1], b[0], b[1], 'a:' + an.id, 22); if (sel && c.hit) for (const [p, k] of [[a, 1], [b, 2]]) { G.circle(p[0], p[1], 7, { fill: '#FFFFFF', stroke: col, w: 2 }); G.circle(p[0], p[1], 16, { fill: 'rgba(0,0,0,0.001)', stroke: 'none', pe: 'all', id: 'h:' + an.id + ':' + k }); } return; }
  const fs = 10.5 * K, tw = textW(text, fs, { font: 'mono', bold: true }) + 10 * K, th = fs + 6 * K;
  let ang = Math.atan2(dy, dx); let deg = ang * 180 / Math.PI;
  if (deg > 90) deg -= 180; if (deg < -90) deg += 180;
  const rad = deg * Math.PI / 180, ct = Math.cos(rad), st = Math.sin(rad);
  const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const cr = (px, py) => [m[0] + px * ct - py * st, m[1] + px * st + py * ct];
  G.poly([cr(-tw / 2, -th / 2), cr(tw / 2, -th / 2), cr(tw / 2, th / 2), cr(-tw / 2, th / 2)], { fill: col, stroke: '#000000', w: 0.9 * K });
  G.text(m[0], m[1], text, { size: fs, rot: deg, font: 'mono', bold: true, fill: lum(col) > 0.55 ? '#111111' : '#FFFFFF' });
  if (an.src === 'laser') checkMark(c, cr(-tw / 2 - 6 * K, 0)[0], cr(-tw / 2 - 6 * K, 0)[1], 7 * K, col, deg);
  if (c.hit) G.hitLine(a[0], a[1], b[0], b[1], 'a:' + an.id, 22);
  if (sel && c.hit) for (const [p, k] of [[a, 1], [b, 2]]) { G.circle(p[0], p[1], 7, { fill: '#FFFFFF', stroke: col, w: 2 }); G.circle(p[0], p[1], 16, { fill: 'rgba(0,0,0,0.001)', stroke: 'none', pe: 'all', id: 'h:' + an.id + ':' + k }); }
}
function drawPhoto(c, ph, x0, y0, W, selAnn) {
  const H = W * ph.h / ph.w;
  c.G.image(x0, y0, W, H, ph.id);
  for (const an of ph.ann) drawAnn(c, an, x0, y0, W, an.id === selAnn);
  return H;
}

/* ---------- logotipo (vetor) ---------- */
function drawLogo(G, x, y, width, o) {
  o = o || {};
  const vb = LOGO.vb;
  const x1 = o.mark ? LOGO.markX1 : vb[0] + vb[2];
  const k = width / (x1 - vb[0]);
  const m = [k, 0, 0, k, x - vb[0] * k, y - vb[1] * k];
  const col = o.colors || { ink: '#2A2826', gold: '#9C7A48', gray: '#6C665D' };
  if (G.layer) G.layer('TG_LOGO');
  for (const it of LOGO.items) {
    if (o.mark && it.r && it.r[0] > LOGO.markX1) continue;
    if (o.mark && it.f === 'gray') continue;
    const f = col[it.f];
    if (it.d) G.path(it.d, m, { fill: f });
    else G.rect(x + (it.r[0] - vb[0]) * k, y + (it.r[1] - vb[1]) * k, it.r[2] * k, it.r[3] * k, { fill: f });
  }
  return (vb[3]) * k;
}

/* ===== Tégora · PDF cotado (A4 paisagem) ===== */
'use strict';

const PW = 841.89, PH = 595.28, PM = 30;
const SRC_TXT = { laser: 'trena (laser)', manual: 'manual' };

function pdfFrame(doc, ctx, title, sub, pageNo, total) {
  const G = doc.addPage(PW, PH);
  const P = PAL_PRINT;
  drawLogo(G, PM, PM - 2, 118, { colors: { ink: '#2A2826', gold: '#9C7A48', gray: '#6C665D' } });
  G.text(PW - PM, PM + 4, title, { size: 15, font: 'serif', bold: true, anchor: 'end', fill: P.ink });
  G.text(PW - PM, PM + 18, sub, { size: 8, anchor: 'end', fill: P.mut });
  G.line(PM, PM + 30, PW - PM, PM + 30, { stroke: P.accent, w: 1 });
  G.line(PM, PH - PM + 4, PW - PM, PH - PM + 4, { stroke: P.faint, w: 0.6 });
  const m = ctx.meta;
  const l1 = ['Cliente: ' + (m.nome || '—'), m.endereco].filter(Boolean).join('  ·  ');
  const l2 = [m.loja && 'Loja: ' + m.loja, m.consultor && 'Consultor: ' + m.consultor, m.arquiteto && 'Arquiteto: ' + m.arquiteto].filter(Boolean).join('  ·  ');
  G.text(PM, PH - PM + 13, l1, { size: 7.5, anchor: 'start', fill: P.ink, bold: true });
  if (l2) G.text(PM, PH - PM + 22, l2, { size: 7, anchor: 'start', fill: P.mut });
  G.text(PW / 2 + 60, PH - PM + 13, 'Unidade: ' + ctx.unit + '   ·   ✓ = medida lida pela trena; sem marca = informada manualmente'.replace('✓', 'v'), { size: 7, fill: P.mut });
  G.text(PW - PM, PH - PM + 13, (m.data || '') + '   ·   ' + pageNo + '/' + total, { size: 7.5, anchor: 'end', fill: P.mut });
  return G;
}

/* tabela simples: cols [{h, w, a}] ; devolve y final */
function pdfTable(G, x, y, cols, rows, o) {
  o = o || {};
  const P = PAL_PRINT, rh = o.rh || 13, fs = o.fs || 7.4;
  const W = cols.reduce((s, c) => s + c.w, 0);
  G.rect(x, y, W, rh, { fill: P.ink });
  let cx = x;
  for (const c of cols) {
    const tx = c.a === 'r' ? cx + c.w - 4 : cx + 4;
    G.text(tx, y + rh / 2, c.h, { size: fs, bold: true, fill: '#FFFFFF', anchor: c.a === 'r' ? 'end' : 'start' });
    cx += c.w;
  }
  y += rh;
  rows.forEach((r, k) => {
    if (k % 2) G.rect(x, y, W, rh, { fill: P.surf });
    let cx2 = x;
    cols.forEach((c, j) => {
      let s = String(r[j] == null ? '' : r[j]);
      while (s.length > 1 && textW(s, fs) > c.w - 8) s = s.slice(0, -2) + '…';
      const tx = c.a === 'r' ? cx2 + c.w - 4 : cx2 + 4;
      G.text(tx, y + rh / 2, s, { size: fs, fill: P.ink, anchor: c.a === 'r' ? 'end' : 'start' });
      cx2 += c.w;
    });
    y += rh;
  });
  G.line(x, y, x + W, y, { stroke: P.faint, w: 0.6 });
  return y;
}

function pdfLegend(G, x, y) {
  const P = PAL_PRINT;
  G.text(x, y, 'LEGENDA', { size: 7, bold: true, anchor: 'start', fill: P.accent });
  y += 11;
  const c = { G, v: new View(1, 0, 0), K: 1, P, hit: false };
  const row = (draw, label) => { draw(); G.text(x + 24, y, label, { size: 7.2, anchor: 'start', fill: P.ink }); y += 12.5; };
  row(() => { G.circle(x + 7, y, 5.5, { fill: '#FFFFFF', stroke: P.ele, w: 1.4 }); G.text(x + 7, y, 'T', { size: 6, bold: true, fill: P.ele }); }, 'Elétrica (círculo)');
  row(() => { G.rect(x + 1.5, y - 5.5, 11, 11, { fill: '#FFFFFF', stroke: P.hid, w: 1.4 }); G.text(x + 7, y, 'AF', { size: 5.5, bold: true, fill: P.hid }); }, 'Hidráulica (quadrado)');
  row(() => { G.rect(x, y - 4, 14, 8, { fill: '#FFFFFF', stroke: P.ar, w: 1.4, r: 2 }); G.text(x + 7, y, 'AC', { size: 5.5, bold: true, fill: P.ar }); }, 'Ar condicionado');
  row(() => { G.rect(x, y - 5, 14, 10, { fill: '#FFFFFF', stroke: P.cor, w: 1.2, dash: [2, 1.5] }); G.text(x + 7, y, '?', { size: 6, bold: true, fill: P.cor }); }, 'Ponto coringa');
  row(() => { G.poly([[x, y - 5], [x + 14, y - 5], [x + 14, y + 4], [x, y + 4]], { fill: P.gesso, stroke: P.gessoLn, w: 0.8 }); }, 'Forro de gesso (rebaixo)');
  row(() => { G.rect(x, y - 3, 14, 6, { fill: P.roda, stroke: P.cor, w: 0.8 }); }, 'Rodaforro');
  row(() => { G.rect(x, y - 3, 14, 6, { fill: P.neg }); }, 'Negativo (sombra)');
  row(() => { G.circle(x + 7, y, 5, { fill: '#FFFFFF', stroke: P.hid, w: 1.2 }); G.line(x + 3.5, y - 3.5, x + 10.5, y + 3.5, { stroke: P.hid, w: 0.8 }); G.line(x + 3.5, y + 3.5, x + 10.5, y - 3.5, { stroke: P.hid, w: 0.8 }); }, 'Ralo');
  row(() => { checkMark(c, x + 7, y, 7, P.dim, 0); }, 'Medida lida pela trena');
  return y;
}

function pdfPlanPage(doc, ctx, room, ri, total) {

  const P = PAL_PRINT, s = roomSummary(room);
  const area = { x: PM, y: PM + 40, w: 560, h: PH - 2 * PM - 52 };

  const v = View.fit(b, area, 78);

  const sx = PM + 575, sw = PW - PM - sx;

  G.text(sx, y, 'RESUMO DO AMBIENTE', { size: 7, bold: true, anchor: 'start', fill: P.accent });
  y += 8;
  const m2 = x => (x / 1e6).toFixed(2).replace('.', ',') + ' m²';

      ops.map(i => [lab.tags[i.id], i.name, wnum(room, i.wall), fmt(i.w) + '×' + fmt(i.h)]), { rh: 12.5, fs: 7 });

  if (notes.length) {
    y += 8;
    G.text(sx, y, 'OBSERVAÇÕES DA MEDIÇÃO', { size: 7, bold: true, anchor: 'start', fill: P.accent });
    y += 10;
    for (const n of notes) for (const ln of wrapText(n, sw, 7)) { if (y > PH - PM - 4) break; G.text(sx, y, ln, { size: 7, anchor: 'start', fill: P.ink }); y += 9; }
  }
}
function wrapText(t, w, size) {
  const out = [];
  for (const para of String(t).split(/\n/)) {
    let cur = '';
    for (const wd of para.split(/\s+/)) {
      const nx = cur ? cur + ' ' + wd : wd;
      if (textW(nx, size) > w && cur) { out.push(cur); cur = wd; } else cur = nx;
    }
    out.push(cur);
  }
  return out;
}

  /* tabela */
  if (nRows) {
    const ty = PH - PM - 4 - tblH + 6;
    const cols = [{ h: 'Id', w: 30 }, { h: 'Item', w: 190 }, { h: 'Cat.', w: 80 }, { h: 'Dist. esq.', w: 70, a: 'r' }, { h: 'Dist. dir.', w: 70, a: 'r' }, { h: 'Altura (z)', w: 70, a: 'r' }, { h: 'L × A', w: 90, a: 'r' }, { h: 'Origem', w: 70 }];
    const rows = items.slice(0, 12).map(it => {
      const tid = it.kind === 'op' ? lab.tags[it.id] : String(lab.nums[it.id]);
      const left = it.kind === 'op' ? it.u : it.u - it.w / 2, right = g.L - (it.kind === 'op' ? it.u + it.w : it.u + it.w / 2);
      const cat = CATS.find(c => c.id === LIBMAP[it.type].cat).short;
      return [tid, it.name, cat, fmt(left), fmt(right), it.kind === 'op' ? (it.z ? fmt(it.z) : 'piso') : fmt(it.z), fmt(it.w) + '×' + fmt(it.h), SRC_TXT[it.src] || 'manual'];
    });

    if (nRows > 12) G.text(PM, ty + 12 * 13 + 8, '+ ' + (nRows - 12) + ' itens não listados.', { size: 6.5, anchor: 'start', fill: P.mut });
  }
}

function pdfPhotoPage(doc, ctx, room, ph, idx, total) {
  const G = pdfFrame(doc, ctx, 'Foto ' + (idx + 1) + ' · ' + room.name, ph.title || 'Foto com medidas', ctx.pg(), total);
  const P = PAL_PRINT;
  const maxW = PW - 2 * PM - 200, maxH = PH - 2 * PM - 52;
  let W = maxW, H = W * ph.h / ph.w;
  if (H > maxH) { H = maxH; W = H * ph.w / ph.h; }
  const x0 = PM, y0 = PM + 40;
  const c = { G, v: new View(1, 0, 0), K: W / 560, P, hit: false };
  drawPhoto(c, ph, x0, y0, W, null);
  const sx = PM + maxW + 14;
  G.text(sx, y0 + 4, 'MEDIDAS NA FOTO', { size: 7, bold: true, anchor: 'start', fill: P.accent });
  ph.ann.forEach((a, k) => {
    const yy = y0 + 20 + k * 13;
    G.rect(sx, yy - 4, 8, 8, { fill: a.color || '#F2C200', stroke: '#000000', w: 0.5 });

  });
}

/* Gera o PDF inteiro. photoBytes: {id:{bytes,w,h}} */
function buildPdf(state, photoBytes) {
  const doc = new PdfDoc();
  for (const id in (photoBytes || {})) doc.addImage(id, photoBytes[id].bytes, photoBytes[id].w, photoBytes[id].h);
  const saved = UNIT;
  setUnit(state.unit);
  const pages = [];
  state.rooms.forEach((r, ri) => {
    if (hasWalls(r)) {
      pages.push(['plan', ri]);
      if (r.ceil.length) pages.push(['ceil', ri]);
      wallOrder(r).forEach(wi => pages.push(['wall', ri, wi]));
    }
    (r.photos || []).forEach((p, k) => pages.push(['photo', ri, k]));
  });
  let n = 0;
  const ctx = { meta: state.meta, unit: state.unit, pg: () => ++n };
  const total = pages.length;
  for (const p of pages) {
    const r = state.rooms[p[1]];
    if (p[0] === 'plan') pdfPlanPage(doc, ctx, r, p[1], total);
    else if (p[0] === 'ceil') pdfCeilPage(doc, ctx, r, total);
    else if (p[0] === 'wall') pdfWallPage(doc, ctx, r, p[2], total);
    else pdfPhotoPage(doc, ctx, r, r.photos[p[2]], p[2], total);
  }
  setUnit(saved);
  return doc.build('Conferência de medidas · ' + (state.meta.nome || 'Cliente'));
}

/* ===== Tégora · DXF da planta baixa no formato do arquivo-modelo (AutoCAD R12 / AC1009, CRLF, camadas TG_*) =====
   Igual ao modelo enviado: cabeçalho mínimo, uma tabela de layers e só entidades LINE
   (mais ARC e CIRCLE nas esquadrias e ralos). Sem handles, polilinhas, textos, cotas, blocos ou hachuras. */
'use strict';

const DXF_LAYERMAP = { TG_PAREDES: 'TG_PAREDES', TG_ESQUADRIAS: 'TG_ESQUADRIAS', TG_HIDRAULICA: 'TG_HIDRAULICA' };
const DXF_COLORS = { TG_PAREDES: 7, TG_ESQUADRIAS: 7, TG_HIDRAULICA: 7 };
const dn = x => { const s = (Math.round(x * 1000) / 1000).toFixed(3).replace(/0+$/, '').replace(/\.$/, ''); return s === '-0' || s === '' ? '0' : s; };
const gc = (code, v) => String(code).padStart(3, ' ') + '\n' + v + '\n';

class DxfG {
  constructor() { this.o = []; this.cur = 'TG_PAREDES'; this.skip = 0; this.hit = false; this.used = new Set(); }
  layer(n) { if (n) this.cur = DXF_LAYERMAP[n] || null; }
  _off() { return this.skip > 0 || !this.cur; }
  _line(x1, y1, x2, y2) {
    this.used.add(this.cur);
    this.o.push(gc(0, 'LINE') + gc(8, this.cur) + gc(10, dn(x1)) + gc(20, dn(-y1)) + gc(30, 0) + gc(11, dn(x2)) + gc(21, dn(-y2)) + gc(31, 0));
  }
  _loop(pts, closed) {
    for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if (Math.hypot(a[0] - b[0], a[1] - b[1]) > 0.01) this._line(a[0], a[1], b[0], b[1]); }
  }
  line(x1, y1, x2, y2, o) { if (this._off() || !(o && o.stroke && o.stroke !== 'none')) return; this._line(x1, y1, x2, y2); }
  _draws(o) {
    if (this._off() || !o) return false;
    if (o.stroke && o.stroke !== 'none') return true;
    return o.fill === '#2A2826' || (o.fill === '#FFFFFF' && this.cur === 'TG_PAREDES');
  }
  rect(x, y, w, h, o) { if (this._draws(o)) this._loop([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true); }
  poly(pts, o) { if (this._draws(o)) this._loop(pts, o.close !== false); }
  circle(cx, cy, r, o) {
    if (this._off() || !(o && o.stroke && o.stroke !== 'none')) return;
    this.used.add(this.cur);
    this.o.push(gc(0, 'CIRCLE') + gc(8, this.cur) + gc(10, dn(cx)) + gc(20, dn(-cy)) + gc(30, 0) + gc(40, dn(r)));
  }
  arc(cx, cy, r, a0, a1) {
    if (this._off()) return;
    const n = a => ((a % 360) + 360) % 360;
    this.used.add(this.cur);
    this.o.push(gc(0, 'ARC') + gc(8, this.cur) + gc(10, dn(cx)) + gc(20, dn(-cy)) + gc(30, 0) + gc(40, dn(r)) + gc(50, dn(n(a0))) + gc(51, dn(n(a1))));
  }
  text() { }
  path() { }
  image() { }
  clipPoly() { this.skip++; }
  clipRect() { this.skip++; }
  unclip() { this.skip--; }
  hitLine() { } hitRect() { }
  sym() { }
}

function dxfDoc(entities, used) {
  const names = Object.keys(DXF_COLORS).filter(n => used.has(n));
  if (!names.length) names.push('TG_PAREDES');
  let s = gc(0, 'SECTION') + gc(2, 'HEADER') + gc(9, '$ACADVER') + gc(1, 'AC1009') + gc(9, '$INSUNITS') + gc(70, 4) + gc(0, 'ENDSEC');
  s += gc(0, 'SECTION') + gc(2, 'TABLES') + gc(0, 'TABLE') + gc(2, 'LAYER') + gc(70, names.length);
  for (const n of names) s += gc(0, 'LAYER') + gc(2, n) + gc(70, 0) + gc(62, DXF_COLORS[n]) + gc(6, 'CONTINUOUS');
  s += gc(0, 'ENDTAB') + gc(0, 'ENDSEC');
  s += gc(0, 'SECTION') + gc(2, 'ENTITIES') + entities + gc(0, 'ENDSEC') + gc(0, 'EOF');
  return s.replace(/\n/g, '\r\n'); /* CRLF em toda linha; termina em EOF+CRLF, sem linha depois (senão o Promob trava) */
}

/* Um ambiente por arquivo, somente a planta baixa. 1 unidade = 1 mm, origem no canto inferior esquerdo. */
function buildDxf(state, ri) {
  const G = new DxfG();
  const room = state.rooms[ri], b = bbox(room.pts);
  drawPlan({ G, v: new View(1, -b.x0, b.y0), K: 6, P: PAL_PRINT, hit: false }, room, {});
  return dxfDoc(G.o.join(''), G.used);
}

/* Mesmas checagens do validar_dxf da especificação; retorna a lista de problemas (vazia = ok) */
function validarDxf(s) {
  const er = [];
  if (/[^\x00-\x7f]/.test(s)) er.push('caracteres fora do ASCII');
  if ((s.match(/\n/g) || []).length !== (s.match(/\r\n/g) || []).length || (s.match(/\r/g) || []).length !== (s.match(/\r\n/g) || []).length) er.push('quebra de linha que nao e CRLF');
  if (!s.endsWith('\r\nEOF\r\n')) er.push('o arquivo deve terminar exatamente em EOF + CRLF');
  const L = s.split('\r\n').slice(0, -1);
  if (L.length % 2) er.push('numero impar de linhas');
  const vals = new Set();
  for (let i = 0; i + 1 < L.length; i += 2) {
    if (!/^-?\d+$/.test(L[i].trim())) { er.push('codigo de grupo invalido na linha ' + (i + 1)); break; }
    if (L[i + 1].trim() === '') { er.push('valor vazio'); break; }
    if (L[i].trim() === '0') vals.add(L[i + 1]);
  }
  for (const p of ['POLYLINE', 'LWPOLYLINE', 'TEXT', 'MTEXT', 'INSERT', 'DIMENSION', 'HATCH', 'SPLINE', 'ELLIPSE']) if (vals.has(p)) er.push('entidade nao permitida: ' + p);
  return er;
}

/* ===== Tégora · interface ===== */
'use strict';

const $ = (s, r) => (r || document).querySelector(s);

let S = null;
const PHOTOS = {};
let UI = { strokes: [], stroke: null, selCorner: null, view: 'client', selDrain: null, newClient: false, tab: 'plan', sel: null, selCeil: null, selPhoto: null, selAnn: null, tool: null, uv: null, annColor: '#F2C200', addRoom: false, draft: null, libCat: 'esq', confirm: null, curV: { s: 1, ox: 0, oy: 0 }, vkey: '' };
let undoStack = [];
let toastT = null, fid = 0;

const CL = () => S.clients[S.cc];

const inv = mm => { const u = UNITS[UNIT]; return String(+(mm / u.f).toFixed(u.dec)).replace('.', ','); };
const toast = (m) => { const t = $('#toast'); if (!t) return; t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); };
const srcBadge = s => s === 'laser' ? '<span class="badge laser">trena ✓</span>' : '<span class="badge">manual</span>';

/* ---------- persistência ---------- */
function persist() {
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { }
}
function persistPhoto(id) {
  try { localStorage.setItem('tegora:ph:' + id, JSON.stringify(PHOTOS[id])); } catch (e) { toast('Sem espaço para guardar esta foto neste navegador. Exporte o projeto (JSON) para não perdê-la.'); }
}
function loadLocal() {
  try {

    const o = migrateState(JSON.parse(s));
    if (!o) return null;
    for (const c of o.clients) for (const r of c.rooms) for (const p of (r.photos || [])) {
      try { const x = localStorage.getItem('tegora:ph:' + p.id); if (x) PHOTOS[p.id] = JSON.parse(x); } catch (e) { }
    }
    return o;
  } catch (e) { return null; }
}
function pushUndo(snap) { undoStack.push(snap || JSON.stringify(S)); if (undoStack.length > 40) undoStack.shift(); }
function tryMut(fn, o) {
  const snap = JSON.stringify(S);
  let r;
  try { r = fn(); } catch (e) { r = { ok: false, msg: 'Não foi possível aplicar essa alteração.' }; }
  if (r && r.ok === false) { S = JSON.parse(snap); toast(r.msg || 'Alteração não aplicada.'); renderAll(); return false; }
  pushUndo(snap); persist(); (o && o.stage) ? renderStage() : renderAll();
  return true;
}
function doUndo() {
  if (!undoStack.length) return;
  S = JSON.parse(undoStack.pop());
  UI.sel = null; UI.selCeil = null; UI.selAnn = null; persist(); renderAll();
}

/* ---------- campos ---------- */
function fld(label, mm, act, data, o) {
  o = o || {};

  const da = Object.entries(data || {}).map(([k, v]) => ` data-${k}="${eh(v)}"`).join('');
  const val = o.txt ? eh(mm) : inv(mm);
  return `<label class="fld"><span>${label}${o.badge ? ' ' + o.badge : ''}</span><div class="in"><input id="${id}" ${o.txt ? 'type="text" class="txt"' : 'type="text" inputmode="decimal" autocomplete="off"'} value="${val}" data-act="${act}"${da}>${o.meas ? `<button type="button" class="meas" data-act="meas" data-t="${id}" title="Leitura simulada da trena GLM 50 C">Medir</button>` : ''}</div></label>`;
}
function sel(label, act, opts, cur, data) {
  const da = Object.entries(data || {}).map(([k, v]) => ` data-${k}="${eh(v)}"`).join('');
  return `<label class="fld"><span>${label}</span><div class="in"><select data-act="${act}"${da}>${opts.map(([v, t]) => `<option value="${eh(v)}"${String(v) === String(cur) ? ' selected' : ''}>${eh(t)}</option>`).join('')}</select></div></label>`;
}
function simRead(cur) {
  if (cur > 0) return Math.max(1, Math.round(cur + (Math.random() * 12 - 6)));
  return Math.round(400 + Math.random() * 3600);
}

/* ---------- vistas ---------- */
function fitKey() {
  return [UI.tab === 'export' ? 'plan' : UI.tab, S.cc, S.cur, UI.tab === 'walls' ? S.wall : '', UI.tab === 'photos' ? UI.selPhoto : ''].join('|');
}
function stageRect() { const r = $('#stage').getBoundingClientRect(); return { w: Math.max(100, r.width), h: Math.max(100, r.height) }; }
function viewFor(rect, K) {
  const room = R(), key = fitKey();
  UI.vkey = key;
  if (UI.uv && UI.uv.key === key) return new View(UI.uv.s, UI.uv.ox, UI.uv.oy);
  if (UI.tab === 'walls') {
    const L = wallLen(room, S.wall);
    return View.fit({ x0: 0, y0: 0, x1: L, y1: room.H + wallTopExtra(room) }, { x: 52 * K, y: 84 * K, w: rect.w - 100 * K, h: rect.h - 112 * K }, 0);
  }
  if (UI.tab === 'photos') {
    const ph = room.photos.find(p => p.id === UI.selPhoto);
    if (ph) return View.fit({ x0: 0, y0: 0, x1: ph.w, y1: ph.h }, { x: 0, y: 0, w: rect.w, h: rect.h }, 6);
  }
  if (!hasWalls(room)) return View.fit({ x0: 0, y0: 0, x1: 10000, y1: 7000 }, { x: 0, y: 0, w: rect.w, h: rect.h }, 24 * K);
  return View.fit(bbox(R().pts), { x: 0, y: 0, w: rect.w, h: rect.h }, 70 * K);
}

function renderStage() {
  const st = $('#stage');
  if (!st || S.cc == null || UI.view !== 'work') return;
  const rc = stageRect(), K = rc.w < 600 ? 1.2 : 1;
  const G = new SvgG(rc.w, rc.h);
  const room = R();
  const v = viewFor(rc, K);
  UI.curV = { s: v.s, ox: v.ox, oy: v.oy };
  const c = { G, v, K, P: PAL_SCREEN, hit: true };
  let hint = '';
  if (UI.tab === 'plan' || UI.tab === 'export') {
    if (!hasWalls(room)) {
      if (UI.tab === 'plan') {
        for (let gx = 0; gx <= 10000; gx += 1000) G.line(v.X(gx), v.Y(0), v.X(gx), v.Y(7000), { stroke: PAL_SCREEN.mut, w: 0.4, op: 0.35 });
        for (let gy = 0; gy <= 7000; gy += 1000) G.line(v.X(0), v.Y(gy), v.X(10000), v.Y(gy), { stroke: PAL_SCREEN.mut, w: 0.4, op: 0.35 });
        const all = UI.strokes.concat(UI.stroke ? [UI.stroke] : []);
        all.forEach(st => { if (st.length > 1) G.poly(st.map(p => [v.X(p[0]), v.Y(p[1])]), { fill: 'none', stroke: PAL_SCREEN.sel, w: 3, close: false }); });
        if (!all.length) G.text(rc.w / 2, rc.h / 2, 'Desenhe o contorno do ambiente com o dedo', { size: 13, fill: PAL_SCREEN.mut });
        hint = 'Contorne o ambiente de canto em canto · as paredes se ajustam ao concluir';
      }
    } else {
      drawPlan(c, room, { selWall: UI.tab === 'plan' ? S.wall : null, selDrain: UI.tab === 'plan' ? UI.selDrain : null, corners: UI.tab === 'plan', selCorner: UI.selCorner });
      hint = UI.tab === 'plan' ? 'Toque numa parede, canto ou ralo · arraste os pontos dos cantos para reposicionar · pinça para zoom' : '';
    }
  } else if (UI.tab === 'walls') {
    drawWall(c, room, S.wall, { sel: UI.sel });

  } else if (UI.tab === 'ceil') {
    drawCeil(c, room, { selCeil: UI.selCeil, hitCeil: true });
    if (UI.draft) {
      const d = UI.draft, x0 = Math.min(d.a[0], d.b[0]), y0 = Math.min(d.a[1], d.b[1]), x1 = Math.max(d.a[0], d.b[0]), y1 = Math.max(d.a[1], d.b[1]);
      G.rect(v.X(x0), v.Y(y1), (x1 - x0) * v.s, (y1 - y0) * v.s, { fill: 'none', stroke: PAL_SCREEN.sel, w: 2, dash: [6, 4] });
      G.text(v.X((x0 + x1) / 2), v.Y((y0 + y1) / 2), fmt(x1 - x0) + ' × ' + fmt(y1 - y0), { size: 11, font: 'mono', bold: true, fill: PAL_SCREEN.sel });
    }
    const fs = UI.cstroke;
    if (fs && fs.length > 1) G.poly(fs.map(p => [v.X(p[0]), v.Y(p[1])]), { fill: 'none', stroke: PAL_SCREEN.sel, w: 3, close: false });
    hint = UI.tool === 'draw' ? CEIL_HINT : UI.tool === 'free' ? 'Contorne a área da ' + UI.freeKind + ' com o dedo, dentro do ambiente · o contorno é ajustado em esquadro' : 'Toque num rebaixo para editar · arraste para mover';
  } else if (UI.tab === 'photos') {

    }
  }
  st.querySelector('#cv').innerHTML = G.toString('style="display:block"');
  $('#hint').textContent = hint;
  $('#hint').hidden = !hint;
}

}

async function serConnect(all) {
  if (!navigator.serial) { BT.err = 'Este navegador não tem Serial por Bluetooth (só Chrome 117 ou mais novo, no computador).'; toast(BT.err); renderBt(); return; }
  const SPP = '00001101-0000-1000-8000-00805f9b34fb';
  BT.state = 'conn'; BT.err = ''; renderBt();
  try {
    let port;
    if (all) port = await navigator.serial.requestPort({});
    else port = await navigator.serial.requestPort({ allowedBluetoothServiceClassIds: [SPP], filters: [{ bluetoothServiceClassId: SPP }] });
    try { const inf = port.getInfo && port.getInfo(); btTrace('porta escolhida: ' + JSON.stringify(inf || {})); } catch (e) { }
    let ok = false, lastErr = null;
    for (let t = 1; t <= 8 && !ok; t++) {
      try { await port.open({ baudRate: 9600 }); ok = true; }
      catch (e) {
        lastErr = e; btTrace('tentativa ' + t + '/8 de abrir a porta falhou: ' + (e.message || e.name));

        await new Promise(r => setTimeout(r, 2000));

    }

    BT.err = ''; btTrace('porta serial aberta');
    BT.port = port; BT.writer = port.writable.getWriter(); BT.state = 'on';
    await btSend(CMD_SYNC, 'sincronizacao C0 55 02 01 00 1A');
    toast('Trena conectada (Bluetooth clássico). Toque em “Medir” ao lado de um campo e meça.');
    renderBt();
    const reader = port.readable.getReader(); BT.reader = reader;
    let buf = [];
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf.push(...value);
      for (;;) {
        const i = buf.indexOf(0xC0); if (i < 0) { buf = []; break; } if (i > 0) buf = buf.slice(i);
        if (buf.length < 3) break;
        const tot = buf[2] + 4;
        if (tot > 64) { buf.shift(); continue; }
        if (buf.length < tot) break;
        const fr = Uint8Array.from(buf.slice(0, tot)); buf = buf.slice(tot);
        btHandle(new DataView(fr.buffer));
      }
    }
  } catch (e) {
    BT.err = e.name === 'NotFoundError' ? 'Nenhuma porta escolhida (a trena precisa estar pareada no sistema e aparecer como porta serial).' : (e.name || 'Erro') + ': ' + (e.message || '');

  }
  BT.state = 'off'; BT.writer = null; BT.port = null; BT.reader = null; renderBt();
}

function compress(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const sc = Math.min(1, 1600 / Math.max(im.width, im.height));
        const w = Math.round(im.width * sc), h = Math.round(im.height * sc);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
        res({ url: cv.toDataURL('image/jpeg', 0.82), w, h });
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function addPhotos(files) {
  const list = Array.from(files || []);
  for (const f of list) {
    try {
      const o = await compress(f);
      const id = uid('p');
      PHOTOS[id] = o; persistPhoto(id);
      tryMut(() => { R().photos.push({ id, w: o.w, h: o.h, title: '', ann: [] }); UI.selPhoto = id; UI.selAnn = null; UI.uv = null; });
    } catch (e) { toast('Não consegui ler essa imagem.'); }
  }
}

      let bin = ''; for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
      N.save(name, btoa(bin)); return;
    } catch (e) { toast('Não foi possível salvar o arquivo (' + (e.message || e) + ').'); return; }
  }
  const d = await getDl();
  try {
    if (d) { await d.save({ filename: name, data }); toast('Arquivo pronto: ' + name); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data])); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast('Arquivo gerado: ' + name);

  }
}

    for (const id in (o.photos || {})) { PHOTOS[id] = o.photos[id]; persistPhoto(id); }
    let n = 0;
    for (const c of st.clients) { const k = S.clients.findIndex(x => x.id === c.id); if (k >= 0) S.clients[k] = c; else S.clients.push(c); n++; }
    S.cc = null; persist(); renderAll(); toast(n + ' cliente(s) importado(s).');
  } catch (e) { toast('Esse arquivo não é um backup do Tégora.'); }
}

/* ---------- interação no desenho ---------- */
const ptrs = new Map();
let drag = null, pinch = null;
const stageEl = () => $('#stage');
const rel = e => { const r = stageEl().getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
const curView = () => new View(UI.curV.s, UI.curV.ox, UI.curV.oy);
function setUV(v) { UI.uv = { key: UI.vkey, s: v.s, ox: v.ox, oy: v.oy }; }
function snapPt(p, v) {
  const room = R(), tol = 10 / v.s;
  const xs = room.pts.map(q => q[0]), ys = room.pts.map(q => q[1]);
  for (const e of room.ceil) if (e.kind === 'rect') { xs.push(e.x, e.x + e.w); ys.push(e.y, e.y + e.h); }
  const sn = (val, arr) => { let b = null, bd = tol; for (const a of arr) if (Math.abs(a - val) < bd) { bd = Math.abs(a - val); b = a; } return b == null ? rnd(val, 10) : b; };
  return [sn(p[0], xs), sn(p[1], ys)];
}
const phNorm = (px, py, ph) => { const v = curView(); return [((px - v.ox) / v.s) / ph.w, ((py - (v.oy - ph.h * v.s)) / v.s) / ph.w]; };

function onDown(e) {
  if (e.target.closest('#hud')) return;
  stageEl().setPointerCapture(e.pointerId);
  const [px, py] = rel(e);
  ptrs.set(e.pointerId, [px, py]);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, v: curView(), c: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] };
    drag = null; UI.draft = null; return;
  }
  const idEl = e.target.closest && e.target.closest('[data-id]');
  const id = idEl ? idEl.getAttribute('data-id') : null;
  const v = curView(), w = v.inv(px, py);
  drag = { px, py, moved: false, kind: 'pan', id, v0: v, w0: w, snap: null };
  const room = R();
  if (UI.tab === 'plan' && !hasWalls(room)) { drag.kind = 'trace'; UI.stroke = [w]; return; }
  if (UI.tab === 'plan' && id && id.startsWith('c:')) {
    UI.selCorner = +id.slice(2); openSheet(); drag.kind = 'corner'; drag.k = UI.selCorner; drag.snap = JSON.stringify(S); drag.room0 = JSON.stringify(room); renderPanel(); renderStage();
  } else if (UI.tab === 'plan' && id && id.startsWith('r:')) {
    const d = room.drains.find(x => x.id === id.slice(2));
    if (d) { drag.kind = 'drain'; drag.d = d; drag.off = [w[0] - d.x, w[1] - d.y]; drag.snap = JSON.stringify(S); UI.selDrain = d.id; openSheet(); renderPanel(); renderStage(); }
  } else if (UI.tab === 'plan' && id && id.startsWith('w:')) drag.kind = 'tapWall';
  else if (UI.tab === 'walls' && id && id.startsWith('i:')) {
    const it = room.items.find(x => x.id === id.slice(2));
    if (it) { drag.kind = 'item'; drag.it = it; drag.off = [w[0] - it.u, w[1] - zc(it)]; UI.sel = it.id; openSheet(); drag.snap = JSON.stringify(S); drag.moved0 = false; renderPanel(); renderStage(); }
  } else if (UI.tab === 'ceil') {
    if (UI.tool === 'free') { drag.kind = 'ctrace'; UI.cstroke = [w]; }
    else if (UI.tool === 'draw') { drag.kind = 'draw'; const p = snapPt(w, v); UI.draft = { a: p, b: p }; }
    else if (id && id.startsWith('f:')) {
      const el = room.ceil.find(x => x.id === id.slice(2));
      if (el) { UI.selCeil = el.id; openSheet(); drag.kind = el.kind === 'rect' ? 'fmove' : 'tapOnly'; drag.el = el; drag.off = [w[0] - el.x, w[1] - el.y]; drag.snap = JSON.stringify(S); renderPanel(); renderStage(); }
    }
  } else if (UI.tab === 'photos') {
    const ph = room.photos.find(p => p.id === UI.selPhoto);
    if (ph) {
      if (id && id.startsWith('h:')) { const [, aid, k] = id.split(':'); drag.kind = 'handle'; drag.an = ph.ann.find(a => a.id === aid); drag.k = +k; drag.ph = ph; drag.snap = JSON.stringify(S); }
      else if (id && id.startsWith('a:')) { const an = ph.ann.find(a => a.id === id.slice(2)); if (an) { UI.selAnn = an.id; drag.kind = 'amove'; drag.an = an; drag.ph = ph; drag.n0 = phNorm(px, py, ph); drag.orig = [an.x1, an.y1, an.x2, an.y2]; drag.snap = JSON.stringify(S); renderPanel(); renderStage(); } }
      else if (UI.tool) { drag.kind = 'annNew'; drag.ph = ph; drag.n0 = phNorm(px, py, ph); }
    }
  }
}
function onMove(e) {
  if (!ptrs.has(e.pointerId)) return;
  const [px, py] = rel(e);
  ptrs.set(e.pointerId, [px, py]);
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const k = d / pinch.d, v0 = pinch.v;
    const s = clamp(v0.s * k, v0.s * 0.05, v0.s * 40);
    const wx = (pinch.c[0] - v0.ox) / v0.s, wy = (v0.oy - pinch.c[1]) / v0.s;
    setUV(new View(s, c[0] - s * wx, c[1] + s * wy)); renderStage(); return;
  }
  if (!drag) return;
  const dx = px - drag.px, dy = py - drag.py;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  const v = drag.v0, room = R();
  if (drag.kind === 'pan' || drag.kind === 'tapWall' || drag.kind === 'tapOnly') { setUV(new View(v.s, v.ox + dx, v.oy + dy)); drag.kind = drag.kind === 'tapOnly' ? 'pan' : 'pan'; renderStage(); return; }
  const w = curView().inv(px, py);
  if (drag.kind === 'ctrace') { const l = UI.cstroke[UI.cstroke.length - 1]; if (Math.hypot(w[0] - l[0], w[1] - l[1]) > 4 / curView().s) UI.cstroke.push(w); renderStage(); return; }
  if (drag.kind === 'trace') { const l = UI.stroke[UI.stroke.length - 1]; if (Math.hypot(w[0] - l[0], w[1] - l[1]) > 4 / curView().s) UI.stroke.push(w); renderStage(); return; }
  if (drag.kind === 'corner') {
    const rr = JSON.parse(drag.room0), t = [rnd(w[0], 10), rnd(w[1], 10)];
    if (moveCorner(rr, drag.k, t)) { S.cc != null && Object.assign(room, rr); drag.okMoved = true; }
    renderStage(); return;
  }
  if (drag.kind === 'item') {
    const it = drag.it, L = wallLen(room, it.wall);
    if (!drag.moved0) { drag.moved0 = true; }
    if (it.kind === 'op') it.u = clamp(rnd(w[0] - drag.off[0], 5), 0, Math.max(0, L - it.w));
    else { it.u = clamp(rnd(w[0] - drag.off[0], 5), 0, L); const nc = clamp(rnd(w[1] - drag.off[1], 5), 0, room.H); it.z = it.zb ? Math.max(0, nc - it.h / 2) : nc; }
    renderStage();
  } else if (drag.kind === 'drain') {
    drag.d.x = rnd(w[0] - drag.off[0], 10); drag.d.y = rnd(w[1] - drag.off[1], 10); renderStage();
  } else if (drag.kind === 'draw') {
    UI.draft.b = snapPt(w, curView()); renderStage();
  } else if (drag.kind === 'fmove') {
    const el = drag.el;
    el.x = rnd(w[0] - drag.off[0], 10); el.y = rnd(w[1] - drag.off[1], 10); renderStage();
  } else if (drag.kind === 'handle') {
    const n = phNorm(px, py, drag.ph), an = drag.an;
    if (drag.k === 1) { an.x1 = n[0]; an.y1 = n[1]; } else { an.x2 = n[0]; an.y2 = n[1]; }
    renderStage();
  } else if (drag.kind === 'amove') {
    const n = phNorm(px, py, drag.ph), an = drag.an, o = drag.orig, ddx = n[0] - drag.n0[0], ddy = n[1] - drag.n0[1];
    an.x1 = o[0] + ddx; an.y1 = o[1] + ddy; an.x2 = o[2] + ddx; an.y2 = o[3] + ddy; renderStage();
  } else if (drag.kind === 'annNew') {
    const n = phNorm(px, py, drag.ph);
    UI.tmpAnn = { id: '_tmp', kind: UI.tool === 'seta' ? 'arrow' : 'dim', x1: drag.n0[0], y1: drag.n0[1], x2: n[0], y2: n[1], mm: 0, lbl: '', color: UI.annColor };
    drag.ph.ann.push(UI.tmpAnn); renderStage(); drag.ph.ann.pop();
  }
}
function onUp(e) {
  ptrs.delete(e.pointerId);
  if (pinch) { if (ptrs.size < 2) pinch = null; if (!ptrs.size) drag = null; return; }
  const d = drag; drag = null;
  if (!d) return;
  const room = R();
  if (d.kind === 'ctrace') {
    const st = UI.cstroke; UI.cstroke = null;
    if (!st || st.length < 6) { renderStage(); return; }
    const res = traceToPoly(st);
    if (!res.ok) { toast(res.msg); renderStage(); return; }
    if (!res.pts.every(p => pointInPoly(p, room.pts))) { toast('O contorno precisa ficar dentro das paredes do ambiente.'); renderStage(); return; }
    const sanca = UI.freeKind === 'sanca';
    tryMut(() => {
      const n = room.ceil.filter(q => q.kind === 'poly' && !!q.sanca === sanca).length + 1;
      const el = newCeil('poly', room, { pts: res.pts, sanca, name: (sanca ? 'Sanca à mão livre ' : 'Rebaixo à mão livre ') + n, drop: sanca ? 150 : 100, trim: sanca ? 'neg' : 'none', tw: sanca ? 60 : 30, nh: room.H + 100 });
      room.ceil.push(el); UI.selCeil = el.id; UI.tool = null; setSheet('peek');
    });
    return;
  }
  if (d.kind === 'trace') {
    const st = UI.stroke; UI.stroke = null;
    if (st && st.length > 3) UI.strokes.push(st);
    const all = [].concat(...UI.strokes);
    if (all.length > 10) {
      const b = bbox(all), D = Math.max(b.w, b.h), a0 = all[0], z = all[all.length - 1];
      if (Math.hypot(a0[0] - z[0], a0[1] - z[1]) < 0.12 * D) { A.traceDone(); return; }
    }
    renderAll(); return;
  }
  if (d.kind === 'corner') { if (d.moved && d.okMoved) { pushUndo(d.snap); persist(); } renderAll(); return; }
  if (d.kind === 'tapWall' && !d.moved) { S.wall = +d.id.slice(2); UI.sheet = (UI.sheet && UI.sheet !== 'min') ? UI.sheet : 'peek'; persist(); renderAll(); return; }
  if (d.kind === 'pan' && !d.moved) {
    if (UI.tab === 'walls' && UI.sel) { UI.sel = null; renderAll(); }
    else if (UI.tab === 'plan' && (UI.selDrain || UI.selCorner != null)) { UI.selDrain = null; UI.selCorner = null; renderAll(); }
    else if (UI.tab === 'ceil' && UI.selCeil && UI.tool !== 'draw') { UI.selCeil = null; renderAll(); }
    else if (UI.tab === 'photos' && UI.selAnn) { UI.selAnn = null; renderAll(); }
    return;
  }
  if (d.kind === 'item') {
    if (!d.moved) return;
    if (overlapOps(room, d.it)) { S = JSON.parse(d.snap); toast('A esquadria encostaria em outra.'); renderAll(); return; }
    d.it.src = 'manual'; pushUndo(d.snap); persist(); renderAll(); return;
  }
  if (d.kind === 'drain') {
    if (!d.moved) return;
    if (!pointInPoly([d.d.x, d.d.y], room.pts)) { S = JSON.parse(d.snap); toast('O ralo precisa ficar dentro do ambiente.'); renderAll(); return; }
    d.d.src = 'manual'; pushUndo(d.snap); persist(); renderAll(); return;
  }
  if (d.kind === 'fmove') {
    if (!d.moved) return;
    const el = d.el;
    if (!rectInsideRoom(el.x, el.y, el.w, el.h, room.pts)) { S = JSON.parse(d.snap); toast('O forro precisa ficar dentro das paredes.'); renderAll(); return; }
    pushUndo(d.snap); persist(); renderAll(); return;
  }
  if (d.kind === 'draw') {
    const a = UI.draft.a, b = UI.draft.b; UI.draft = null;
    const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]), w = Math.abs(a[0] - b[0]), h = Math.abs(a[1] - b[1]);
    if (w < 50 || h < 50) { renderStage(); return; }
    if (!rectInsideRoom(x, y, w, h, room.pts)) { toast('O forro precisa ficar dentro das paredes do ambiente.'); renderStage(); return; }
    tryMut(() => { const el = newCeil('rect', room, { x, y, w, h, name: 'Forro rebaixado ' + (room.ceil.filter(q => q.kind === 'rect').length + 1) }); room.ceil.push(el); UI.selCeil = el.id; UI.tool = null; });
    return;
  }
  if (d.kind === 'handle' || d.kind === 'amove') { if (d.moved) { pushUndo(d.snap); persist(); } renderAll(); return; }
  if (d.kind === 'annNew') {
    if (!d.moved) return;
    const [px, py] = rel(e), n = phNorm(px, py, d.ph);
    if (Math.hypot(n[0] - d.n0[0], n[1] - d.n0[1]) < 0.02) { renderStage(); return; }
    tryMut(() => { const an = { id: uid('a'), kind: UI.tool === 'seta' ? 'arrow' : 'dim', x1: d.n0[0], y1: d.n0[1], x2: n[0], y2: n[1], mm: 0, lbl: '', color: UI.annColor, src: 'manual' }; d.ph.ann.push(an); UI.selAnn = an.id; UI.tool = null; });
    if (UI.selAnn) toast('Agora informe a medida no painel (ou use “Medir”).');
  }
}
function onWheel(e) {
  e.preventDefault();
  const [px, py] = rel(e), v = curView();
  const k = Math.exp(-e.deltaY * 0.0015), s = clamp(v.s * k, v.s * 0.1, v.s * 20);
  const wx = (px - v.ox) / v.s, wy = (v.oy - py) / v.s;
  setUV(new View(s, px - s * wx, py + s * wy)); renderStage();
}

/* ---------- inicialização ---------- */
function drawHeaderLogo() {
  const G = new SvgG(LOGO.vb[2], LOGO.vb[3]);
  drawLogo(G, 0, 0, LOGO.vb[2] - 0, { colors: { ink: 'var(--fg)', gold: 'var(--accent)', gray: 'var(--muted)' } });
  $('#logo').innerHTML = G.toString('class="logo" preserveAspectRatio="xMinYMid meet"').replace(/ width="[^"]*" height="[^"]*"/, '').replace('<svg', '<svg style="width:100%;height:100%"');
}
function boot() {
  S = loadLocal() || newState();
  setUnit(S.unit || 'mm');
  const gp = $('#grip');
  let gd = null;
  gp.addEventListener('pointerdown', e => { gp.setPointerCapture(e.pointerId); gd = { y: e.clientY, h: $('#sheet').getBoundingClientRect().height, moved: false }; $('#sheet').classList.add('drag'); });
  gp.addEventListener('pointermove', e => { if (!gd) return; const dy = e.clientY - gd.y; if (Math.abs(dy) > 4) gd.moved = true; if (gd.moved) $('#sheet').style.height = Math.max(46, Math.min(sheetH('full'), gd.h - dy)) + 'px'; });
  const gend = () => {
    if (!gd) return; $('#sheet').classList.remove('drag');
    if (!gd.moved) setSheet(UI.sheet === 'min' ? 'peek' : 'min');
    else { const h = $('#sheet').getBoundingClientRect().height, c = ['min', 'peek', 'full'].map(k => [k, Math.abs(sheetH(k) - h)]).sort((a, b) => a[1] - b[1])[0][0]; setSheet(c); }
    gd = null;
  };
  gp.addEventListener('pointerup', gend); gp.addEventListener('pointercancel', gend);
  window.addEventListener('resize', applySheet);
  const st = stageEl();
  st.addEventListener('pointerdown', onDown);
  st.addEventListener('pointermove', onMove);
  st.addEventListener('pointerup', onUp);
  st.addEventListener('pointercancel', onUp);
  st.addEventListener('wheel', onWheel, { passive: false });
  $('#fit').onclick = () => { UI.uv = null; renderStage(); };
  $('#zin').onclick = () => { const v = curView(), r = stageRect(); const s = v.s * 1.3, cx = r.w / 2, cy = r.h / 2; const wx = (cx - v.ox) / v.s, wy = (v.oy - cy) / v.s; setUV(new View(s, cx - s * wx, cy + s * wy)); renderStage(); };
  $('#zout').onclick = () => { const v = curView(), r = stageRect(); const s = v.s / 1.3, cx = r.w / 2, cy = r.h / 2; const wx = (cx - v.ox) / v.s, wy = (v.oy - cy) / v.s; setUV(new View(s, cx - s * wx, cy + s * wy)); renderStage(); };
  document.querySelectorAll('.tab').forEach(t => { t.dataset.act = 'tab'; });
  $('#undo').dataset.act = 'undo'; $('#back').dataset.act = 'back';
  $('#conn').dataset.act = 'conectar'; renderBt();
  drawHeaderLogo();
  renderAll();
  if (window.ResizeObserver) new ResizeObserver(() => renderStage()).observe(st);
  window.addEventListener('resize', () => renderStage());
}
document.addEventListener('DOMContentLoaded', boot);
